<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ARROW PUZZLE</title>
  <style>
:root {
  --bg: #14213d;
  --panel: #1d2d50;
  --cell: #f4f1e8;
  --line: #d8d2c0;
  --text: #f4f1e8;
  --accent: #fca311;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 32px;
}

.title {
  text-align: center;
  margin: 8px 0 12px;
  letter-spacing: 0.15em;
  font-size: clamp(24px, 6vw, 36px);
  color: var(--accent);
}

.status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.remaining { font-size: 18px; }
.remaining strong { font-size: 28px; color: var(--accent); }

.btn {
  font: inherit;
  font-size: 16px;
  padding: 8px 18px;
  border-radius: 8px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  touch-action: manipulation;
}
.btn:hover { background: rgba(252, 163, 17, 0.15); }
.btn.primary { background: var(--accent); color: #14213d; font-weight: bold; }
.btn.primary:hover { background: #ffb73d; }

.board-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
}

.board {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--cell);
  touch-action: manipulation;
}

.grid-line { stroke: var(--line); stroke-width: 0.03; }

.arrow-hit { stroke: transparent; stroke-width: 0.8; fill: none; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
.arrow-body { fill: none; stroke-width: 0.3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.arrow-head { pointer-events: none; }
.arrow.moving .arrow-hit { pointer-events: none; }
.arrow:not(.moving):hover .arrow-body { filter: brightness(1.15); }

.arrow.shake { animation: shake 0.35s; }
.arrow.blocker { animation: flash 0.7s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-0.08px); }
  40% { transform: translateX(0.08px); }
  60% { transform: translateX(-0.06px); }
  80% { transform: translateX(0.06px); }
}
@keyframes flash {
  0%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.25; }
  50% { opacity: 1; }
}

.message {
  min-height: 1.6em;
  text-align: center;
  margin: 12px 0;
  color: #ff8f8f;
  font-weight: bold;
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20, 33, 61, 0.82);
}
.overlay.hidden { display: none; }
.overlay-box { text-align: center; padding: 16px; }
.overlay-title { font-size: clamp(36px, 10vw, 56px); font-weight: bold; color: var(--accent); letter-spacing: 0.1em; }

.howto {
  background: var(--panel);
  border-radius: 12px;
  padding: 4px 18px 12px;
  font-size: 14px;
  line-height: 1.7;
}
.howto h2 { font-size: 16px; color: var(--accent); }
.howto ul { margin: 0; padding-left: 1.2em; }

/* --- 難易度表示・変更 --- */
body[data-mode="hard"] .app { max-width: 760px; }
.board-wrap { width: min(100%, max(320px, calc(100vh - 300px))); margin: 0 auto; }
.mode-label { font-size: 16px; }
.mode-label strong { color: var(--accent); font-size: 18px; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.lives { font-size: 24px; letter-spacing: 0.1em; color: #ff5d73; }
.lives .lost { color: #5b6b8c; }
.overlay-title.over { color: #ff5d73; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(10, 16, 32, 0.92);
}
.modal.hidden { display: none; }
.modal-box {
  width: 100%;
  max-width: 420px;
  background: var(--panel);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.modal-box h2 { margin: 0 0 16px; font-size: 20px; color: var(--accent); }
.modal-box p { line-height: 1.7; margin: 0 0 16px; }
.modal-box .btn { display: block; width: 100%; margin-top: 10px; padding: 12px 18px; }
.modal-box .btn small { display: block; font-size: 12px; font-weight: normal; opacity: 0.85; margin-top: 2px; }
.modal-title-big { font-size: clamp(26px, 7vw, 36px); letter-spacing: 0.12em; color: var(--accent); font-weight: bold; margin-bottom: 6px; }
.hidden { display: none !important; }
</style>
</head>
<body>
  <main class="app">
    <h1 class="title">ARROW PUZZLE</h1>

    <div class="status">
      <div class="mode-label">難易度：<strong id="mode-label">-</strong></div>
      <button id="mode-btn" class="btn small" type="button">難易度変更</button>
    </div>

    <div class="status">
      <div class="remaining">残り <strong id="remaining">0</strong> 本</div>
      <div class="lives" id="lives" aria-label="残りライフ"></div>
      <button id="reset-btn" class="btn" type="button">リセット</button>
    </div>

    <div class="board-wrap">
      <svg id="board" class="board" aria-label="ゲーム盤面"></svg>
      <div id="gameover-overlay" class="overlay hidden">
        <div class="overlay-box">
          <div class="overlay-title over">GAME OVER</div>
          <p>3回ミスしました</p>
          <button id="gameover-retry-btn" class="btn primary" type="button">もう一度あそぶ</button>
        </div>
      </div>
      <div id="clear-overlay" class="overlay hidden">
        <div class="overlay-box">
          <div class="overlay-title">CLEAR!</div>
          <p>すべての矢印を取り除きました</p>
          <button id="retry-btn" class="btn primary" type="button">もう一度あそぶ</button>
        </div>
      </div>
    </div>

    <p id="message" class="message" role="status" aria-live="polite">&nbsp;</p>

    <section class="howto">
      <h2>あそびかた</h2>
      <ul>
        <li>取り除きたい矢印をクリック（タップ）します。</li>
        <li>先端が向いている方向に、盤面の端まで他の矢印がなければ飛んでいきます。</li>
        <li>邪魔な矢印があるときは動けません。先に別の矢印をどかしましょう。</li>
        <li>動かせない矢印を3回選ぶとゲームオーバーです（残りライフは♥で表示）。</li>
        <li>すべての矢印を消したらクリアです。</li>
      </ul>
    </section>
  </main>

  <!-- 難易度選択（タイトル画面・ゲーム中の変更の両方で使用） -->
  <div id="mode-modal" class="modal hidden">
    <div class="modal-box">
      <div id="modal-select">
        <div id="modal-logo" class="modal-title-big">ARROW PUZZLE</div>
        <h2 id="modal-title">難易度を選んでください</h2>
        <button class="btn primary mode-choice" type="button" data-mode="normal">通常モード<small>8×8マス</small></button>
        <button class="btn primary mode-choice" type="button" data-mode="hard">難しいモード<small>16×16マス・矢印の数4倍</small></button>
        <button id="modal-cancel" class="btn hidden" type="button">キャンセル</button>
      </div>
      <div id="modal-confirm" class="hidden">
        <h2>難易度を変更しますか？</h2>
        <p id="confirm-text"></p>
        <button id="confirm-yes" class="btn primary" type="button">変更する</button>
        <button id="confirm-no" class="btn" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
"use strict";
/* ============================================================
   ARROW PUZZLE
   構成:
     1. STAGES  ... ステージデータ（論理座標のみ。ここに追加すれば増やせる）
     2. Logic   ... 矢印データの生成・移動可否判定（画面に依存しない）
     3. View    ... SVG描画とアニメーション（論理座標 → 表示）
     4. Game    ... 入力・状態管理（残り本数・クリア・リセット）
   座標は [x, y]（x: 左→右, y: 上→下, 0始まり）のマス目座標。
   ============================================================ */

/* ---------- 1. STAGES ---------- */
const COLORS = {
  red: "#e63946",
  blue: "#1d70b8",
  green: "#2a9d8f",
  orange: "#f4811f",
  purple: "#8e44ad",
  pink: "#e75a9b",
  teal: "#00a6c8",
  brown: "#8d5a2b",
  gold: "#c9a400",
};

const STAGES = [
  {
    name: "Stage 1",
    size: 8,
    // path: 後ろ（尾）→ 先頭 の順。先頭の向きは「最後の2マスを結ぶ向き」。
    arrows: [
      { id: "A", color: "red",    path: [[1,1],[0,1]] },
      { id: "B", color: "blue",   path: [[6,0],[6,1],[7,1],[7,0]] },
      { id: "C", color: "green",  path: [[4,2],[4,1],[4,0]] },
      { id: "D", color: "orange", path: [[0,0],[1,0],[2,0],[3,0],[3,1],[2,1]] },
      { id: "E", color: "purple", path: [[7,7],[7,6],[7,5],[7,4],[7,3]] },
      { id: "F", color: "pink",   path: [[2,7],[3,7],[4,7],[4,6],[5,6]] },
      { id: "G", color: "red",    path: [[1,4],[1,5],[0,5],[0,6],[0,7]] },
      { id: "H", color: "blue",   path: [[5,0],[5,1],[5,2],[6,2],[6,3],[6,4]] },
      { id: "I", color: "green",  path: [[3,2],[2,2],[1,2],[1,3],[0,3]] },
      { id: "J", color: "orange", path: [[2,6],[2,5],[3,5],[3,4],[4,4],[4,3]] },
    ],
  },
];

/* ---------- 2. Logic（画面に依存しない） ---------- */
const Logic = {
  /** ステージ定義 → 矢印オブジェクト（id/色/経路/先端/向き/消去済み）を生成 */
  createArrows(stage) {
    return stage.arrows.map((def) => {
      const path = def.path.map(([x, y]) => ({ x, y }));
      const head = path[path.length - 1];
      const prev = path[path.length - 2];
      return {
        id: def.id,
        color: COLORS[def.color] || def.color,
        path,
        head,
        dir: { dx: Math.sign(head.x - prev.x), dy: Math.sign(head.y - prev.y) },
        removed: false,
      };
    });
  },

  /** 消去されていない矢印が占めるマス → 矢印 の対応表 */
  occupancy(arrows) {
    const map = new Map();
    for (const a of arrows) {
      if (a.removed) continue;
      for (const c of a.path) map.set(c.x + "," + c.y, a);
    }
    return map;
  },

  /**
   * 移動可否判定。
   * 先端のマスから進行方向へ盤面の端まで一直線に調べ、
   * 他の矢印が1つでもあれば移動不可（blockers に入れて返す）。
   * 折れ曲がった胴体部分の進行方向は判定しない。
   */
  checkMove(arrow, arrows, size) {
    const occ = Logic.occupancy(arrows);
    const blockers = new Set();
    const { dx, dy } = arrow.dir;
    let x = arrow.head.x + dx, y = arrow.head.y + dy;
    while (x >= 0 && y >= 0 && x < size && y < size) {
      const other = occ.get(x + "," + y);
      if (other && other !== arrow) blockers.add(other);
      x += dx; y += dy;
    }
    return { movable: blockers.size === 0, blockers: [...blockers] };
  },

  /** 矢印が盤面から完全に出るまでに必要な移動マス数 */
  exitDistance(arrow, size) {
    const { dx, dy } = arrow.dir;
    let d = Infinity;
    for (const c of arrow.path) {
      const need = dx > 0 ? size - c.x : dx < 0 ? c.x + 1 : dy > 0 ? size - c.y : c.y + 1;
      d = Math.min(d, need);
    }
    return d;
  },

  /** ステージがクリア可能か検証（取り除くほど有利になるので貪欲法で判定できる） */
  isSolvable(stage) {
    const arrows = Logic.createArrows(stage);
    let progress = true;
    while (progress) {
      progress = false;
      for (const a of arrows) {
        if (!a.removed && Logic.checkMove(a, arrows, stage.size).movable) {
          a.removed = true;
          progress = true;
        }
      }
    }
    return arrows.every((a) => a.removed);
  },

  /** 経路の妥当性（隣接・重なりなし・盤面内）の検証。問題があれば文字列配列で返す */
  validate(stage) {
    const errors = [];
    const seen = new Map();
    for (const def of stage.arrows) {
      def.path.forEach(([x, y], i) => {
        if (x < 0 || y < 0 || x >= stage.size || y >= stage.size) errors.push(`${def.id}: 盤面外 (${x},${y})`);
        const key = x + "," + y;
        if (seen.has(key)) errors.push(`${def.id}: ${seen.get(key)} と重なり (${x},${y})`);
        seen.set(key, def.id);
        if (i > 0) {
          const [px, py] = def.path[i - 1];
          if (Math.abs(px - x) + Math.abs(py - y) !== 1) errors.push(`${def.id}: 経路が連結していない (${px},${py})→(${x},${y})`);
        }
      });
    }
    return errors;
  },
};

/* ---------- 2b. Generator（難しいモードのステージ自動生成） ----------
   「最後に取り除く矢印から順に置いていく」方式で作るため、必ずクリアできる。
   新しい矢印は、先端の直線上に既存の矢印が無い位置にだけ置く
   （＝既存の矢印より先に取り除ける）。後から置いた矢印が、先に置いた
   矢印の進路を塞ぐので、順番を考えないとクリアできない配置になる。
   乱数はシード固定なので、毎回同じステージになる。 */
const Generator = {
  mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  turns(path) {
    let n = 0;
    for (let i = 2; i < path.length; i++) {
      if (path[i][0] - path[i - 1][0] !== path[i - 1][0] - path[i - 2][0] ||
          path[i][1] - path[i - 1][1] !== path[i - 1][1] - path[i - 2][1]) n++;
    }
    return n;
  },

  /** 1回分の生成（seed固定）。count本に届かなければ少ない本数で返る */
  build(size, count, seed) {
    const rnd = this.mulberry32(seed);
    const palette = ["red", "blue", "green", "orange", "purple", "pink", "teal", "brown", "gold"];
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const occ = new Map(); // "x,y" -> 色名
    const arrows = [];
    let fails = 0;

    const rayClear = (path) => {
      const n = path.length;
      const dx = path[n - 1][0] - path[n - 2][0], dy = path[n - 1][1] - path[n - 2][1];
      let x = path[n - 1][0] + dx, y = path[n - 1][1] + dy;
      while (x >= 0 && y >= 0 && x < size && y < size) {
        if (occ.has(x + "," + y)) return false;
        x += dx; y += dy;
      }
      return true;
    };

    while (arrows.length < count && fails < 8000) {
      const late = fails > 3000; // 盤面が埋まってきたら短い矢印も許可
      const len = late ? 2 + Math.floor(rnd() * 3)
        : rnd() < 0.45 ? 3 + Math.floor(rnd() * 2) : 5 + Math.floor(rnd() * 6);
      let x = Math.floor(rnd() * size), y = Math.floor(rnd() * size);
      if (occ.has(x + "," + y)) { fails++; continue; }

      const path = [[x, y]];
      const seen = new Set([x + "," + y]);
      let last = null;
      while (path.length < len) {
        const opts = dirs.filter((d) => {
          const nx = x + d[0], ny = y + d[1], k = nx + "," + ny;
          return nx >= 0 && ny >= 0 && nx < size && ny < size && !occ.has(k) && !seen.has(k);
        });
        if (!opts.length) break;
        let d = opts[Math.floor(rnd() * opts.length)];
        if (last && rnd() < 0.3 && opts.some((o) => o[0] === last[0] && o[1] === last[1])) d = last;
        x += d[0]; y += d[1];
        path.push([x, y]); seen.add(x + "," + y); last = d;
      }
      if (path.length < (late ? 2 : 3)) { fails++; continue; }

      // どちらの端を先端にするか（空いている方）
      const rev = path.slice().reverse();
      const order = rnd() < 0.5 ? [path, rev] : [rev, path];
      const chosen = order.find(rayClear);
      if (!chosen) { fails++; continue; }

      // 隣り合う矢印と色が被らないようにする
      const near = new Set();
      for (const c of chosen) for (const d of dirs) {
        const col = occ.get((c[0] + d[0]) + "," + (c[1] + d[1]));
        if (col) near.add(col);
      }
      const free = palette.filter((c) => !near.has(c));
      const pool = free.length ? free : palette;
      const color = pool[Math.floor(rnd() * pool.length)];

      chosen.forEach((c) => occ.set(c[0] + "," + c[1], color));
      arrows.push({ id: "h" + (arrows.length + 1), color, path: chosen });
      fails = 0;
    }
    // 置いた順の逆が取り除く順なので、並びは気にしなくてよい
    return { name: "Hard", size, seed, arrows };
  },

  /** 取り除ける矢印を一斉に取り除く操作を繰り返し、何回で終わるか（＝依存の深さ） */
  layers(stage) {
    const arrows = Logic.createArrows(stage);
    let rounds = 0;
    for (;;) {
      const now = arrows.filter((a) => !a.removed && Logic.checkMove(a, arrows, stage.size).movable);
      if (!now.length) break;
      now.forEach((a) => (a.removed = true));
      rounds++;
    }
    return arrows.every((a) => a.removed) ? rounds : -1;
  },

  /** 条件を満たすシードを探して、ステージを返す */
  /**
   * ランダムなシードで生成を繰り返し、条件を満たす盤面を返す。
   * opts: minRounds（必要な段階数）, minLong（長い曲がり矢印の数）,
   *       maxMovable（最初から動かせる矢印の上限）, maxTries, budgetMs（探索時間の上限）
   * 条件を満たすものが無ければ、本数が揃った中で最良のもの（無ければ null）を返す。
   */
  make(size, count, opts) {
    const t0 = performance.now();
    let best = null, bestScore = -Infinity;
    for (let i = 0; i < opts.maxTries && performance.now() - t0 < opts.budgetMs; i++) {
      const seed = Math.floor(Math.random() * 1e9);
      const stage = this.build(size, count, seed);
      if (stage.arrows.length < count) continue;
      const rounds = this.layers(stage);
      if (rounds < 0) continue;
      const long = stage.arrows.filter((a) => a.path.length >= 6 && this.turns(a.path) >= 2).length;
      const arrows = Logic.createArrows(stage);
      const movable = arrows.filter((a) => Logic.checkMove(a, arrows, size).movable).length;
      if (rounds >= opts.minRounds && long >= opts.minLong && movable <= opts.maxMovable) return stage;
      const score = rounds * 2 + long - movable;
      if (score > bestScore) { bestScore = score; best = stage; }
    }
    return best;
  },
};

/* ---------- 難易度の定義 ----------
   newStage() は呼ぶたびに新しいランダム盤面を返す（生成に失敗した場合は固定盤面） */
const MODES = {
  normal: {
    label: "通常モード", sizeText: "8×8",
    newStage() {
      return Generator.make(8, 10, { minRounds: 3, minLong: 2, maxMovable: 6, maxTries: 300, budgetMs: 1500 })
        || STAGES[0];
    },
  },
  hard: {
    label: "難しいモード", sizeText: "16×16",
    newStage() {
      // 矢印の総数は通常モードの4倍（40本）
      return Generator.make(16, 40, { minRounds: 4, minLong: 8, maxMovable: 24, maxTries: 300, budgetMs: 4000 })
        || Generator.build(16, 40, 112);
    },
  },
};

/* ---------- 3. View（SVG描画） ---------- */
const SVG_NS = "http://www.w3.org/2000/svg";

function svgEl(name, attrs) {
  const el = document.createElementNS(SVG_NS, name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

const View = {
  svg: null,
  size: 0,
  groups: new Map(), // arrow.id -> <g>

  init(svg) { this.svg = svg; },

  /** 盤面と矢印をすべて描き直す。onArrowClick(arrow) を各矢印に登録 */
  render(arrows, size, onArrowClick) {
    this.size = size;
    this.groups.clear();
    const svg = this.svg;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.innerHTML = "";

    for (let i = 1; i < size; i++) {
      svg.appendChild(svgEl("line", { class: "grid-line", x1: i, y1: 0, x2: i, y2: size }));
      svg.appendChild(svgEl("line", { class: "grid-line", x1: 0, y1: i, x2: size, y2: i }));
    }

    for (const arrow of arrows) {
      const g = svgEl("g", { class: "arrow", "data-id": arrow.id });
      const pts = arrow.path.map((c) => `${c.x + 0.5},${c.y + 0.5}`).join(" ");
      g.appendChild(svgEl("polyline", { class: "arrow-hit", points: pts }));
      g.appendChild(svgEl("polyline", { class: "arrow-body", points: pts, stroke: arrow.color }));

      // 矢じり: 先端マスの中心から進行方向へ三角形
      const { dx, dy } = arrow.dir;
      const cx = arrow.head.x + 0.5, cy = arrow.head.y + 0.5;
      const tip = [cx + dx * 0.5, cy + dy * 0.5];
      const base = [cx - dx * 0.02, cy - dy * 0.02];
      const px = -dy, py = dx; // 垂直方向
      const w = 0.32;
      const poly = [tip, [base[0] + px * w, base[1] + py * w], [base[0] - px * w, base[1] - py * w]]
        .map((p) => p.join(",")).join(" ");
      g.appendChild(svgEl("polygon", { class: "arrow-head", points: poly, fill: arrow.color }));

      g.addEventListener("click", () => onArrowClick(arrow));
      svg.appendChild(g);
      this.groups.set(arrow.id, g);
    }
  },

  /** 形を保ったまま進行方向へ平行移動して盤面外へ。完了で Promise 解決＆要素削除 */
  animateOut(arrow, distance) {
    const g = this.groups.get(arrow.id);
    g.classList.add("moving");
    this.svg.appendChild(g); // 移動中は最前面に表示（他の矢印の上を通過しても見えるように）
    const { dx, dy } = arrow.dir;
    const size = this.size;

    // 軌道 = 元の経路（マス中心）＋ 先端から進行方向への直線（盤面外まで）
    const track = arrow.path.map((c) => [c.x + 0.5, c.y + 0.5]);
    const hx = arrow.head.x + 0.5, hy = arrow.head.y + 0.5;
    const toEdge = dx > 0 ? size - hx : dx < 0 ? hx : dy > 0 ? size - hy : hy;
    const out = toEdge + 1; // 先端中心から完全に盤面外へ出る距離
    track.push([hx + dx * out, hy + dy * out]);

    // 各頂点までの累積距離
    const cum = [0];
    for (let i = 1; i < track.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(track[i][0] - track[i - 1][0], track[i][1] - track[i - 1][1]));
    }
    const bodyLen = cum[arrow.path.length - 1]; // 元の矢印の長さ
    const total = bodyLen + out;                // 尾が盤面外へ出きるまでの進行量

    const pointAt = (a) => {
      for (let i = 1; i < track.length; i++) {
        if (a <= cum[i]) {
          const r = (a - cum[i - 1]) / (cum[i] - cum[i - 1]);
          return [track[i - 1][0] + (track[i][0] - track[i - 1][0]) * r,
                  track[i - 1][1] + (track[i][1] - track[i - 1][1]) * r];
        }
      }
      return track[track.length - 1];
    };

    const bodyEl = g.querySelector(".arrow-body");
    const headEl = g.querySelector(".arrow-head");
    g.querySelector(".arrow-hit").setAttribute("points", "");

    // 尾の位置 s から長さ bodyLen 分の蛇の形（自分の通った経路をなぞる）を描く
    const draw = (s) => {
      const pts = [pointAt(s)];
      for (let i = 0; i < track.length; i++) {
        if (cum[i] > s && cum[i] < s + bodyLen) pts.push(track[i]);
      }
      const hp = pointAt(s + bodyLen);
      pts.push(hp);
      bodyEl.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
      headEl.setAttribute("points", View.headPoints(hp[0], hp[1], dx, dy));
    };

    const duration = Math.max(400, Math.min(total * 90, 1200));
    return new Promise((resolve) => {
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        draw(total * t * (0.4 + 0.6 * t)); // 少しずつ加速
        if (t < 1) requestAnimationFrame(step);
        else { g.remove(); this.groups.delete(arrow.id); resolve(); }
      };
      requestAnimationFrame(step);
    });
  },

  /** 矢じり（三角形）の頂点文字列。(cx,cy)=先端中心、(dx,dy)=進行方向 */
  headPoints(cx, cy, dx, dy) {
    const tip = [cx + dx * 0.5, cy + dy * 0.5];
    const base = [cx - dx * 0.02, cy - dy * 0.02];
    const px = -dy, py = dx, w = 0.32;
    return [tip, [base[0] + px * w, base[1] + py * w], [base[0] - px * w, base[1] - py * w]]
      .map((p) => p.join(",")).join(" ");
  },

  /** 動けない時の演出: 自身を揺らし、邪魔している矢印を点滅 */
  showBlocked(arrow, blockers) {
    const flash = (id, cls) => {
      const g = this.groups.get(id);
      if (!g) return;
      g.classList.remove(cls);
      void g.getBoundingClientRect(); // アニメーション再始動
      g.classList.add(cls);
      setTimeout(() => g.classList.remove(cls), 800);
    };
    flash(arrow.id, "shake");
    blockers.forEach((b) => flash(b.id, "blocker"));
  },
};

/* ---------- 4. Game（状態管理・入力） ---------- */
const Game = {
  mode: null,        // "normal" | "hard"（null = まだ選んでいない）
  pendingMode: null, // 変更確認中の難易度
  session: 0,        // リセットのたびに増やす（進行中のアニメーションを無効化するため）
  MAX_MISTAKES: 3,   // この回数ミス（動かせない矢印を選ぶ）するとゲームオーバー
  mistakes: 0,
  over: false,
  stage: null,
  arrows: [],
  busy: false,
  msgTimer: null,

  $(id) { return document.getElementById(id); },

  init() {
    View.init(this.$("board"));
    this.$("reset-btn").addEventListener("click", () => this.reset());
    // 「もう一度あそぶ」は新しいランダム盤面、「リセット」は同じ盤面をやり直し
    this.$("retry-btn").addEventListener("click", () => this.reset(true));
    this.$("gameover-retry-btn").addEventListener("click", () => this.reset(true));

    // 難易度選択・変更
    this.$("mode-btn").addEventListener("click", () => this.openModal());
    this.$("modal-cancel").addEventListener("click", () => this.closeModal());
    this.$("confirm-no").addEventListener("click", () => this.openModal());
    this.$("confirm-yes").addEventListener("click", () => this.startMode(this.pendingMode));
    document.querySelectorAll(".mode-choice").forEach((btn) =>
      btn.addEventListener("click", () => this.chooseMode(btn.dataset.mode)));

    // 開発時の安全確認（ステージデータの誤りをコンソールに出す）
    this.checkStage(STAGES[0]);

    this.openModal(); // 最初はタイトル兼 難易度選択画面
  },

  checkStage(s) {
    const errs = Logic.validate(s);
    if (errs.length) console.error(s.name, errs);
    else if (!Logic.isSolvable(s)) console.error(s.name + ": クリア不可能な配置です");
  },

  /** 難易度選択画面を開く。ゲーム開始前はタイトル表示、ゲーム中はキャンセル可能 */
  openModal() {
    const started = this.mode !== null;
    this.pendingMode = null;
    this.$("modal-select").classList.remove("hidden");
    this.$("modal-confirm").classList.add("hidden");
    this.$("modal-logo").classList.toggle("hidden", started);
    this.$("modal-title").textContent = started ? "難易度を選んでください" : "難易度を選んでスタート";
    this.$("modal-cancel").classList.toggle("hidden", !started);
    this.$("mode-modal").classList.remove("hidden");
  },

  closeModal() { this.$("mode-modal").classList.add("hidden"); },

  chooseMode(key) {
    if (this.mode === null) { this.startMode(key); return; } // 開始時は確認不要
    // ゲーム中の変更は確認画面を挟む
    this.pendingMode = key;
    const m = MODES[key];
    this.$("confirm-text").textContent =
      `「${m.label}（${m.sizeText}）」に変更します。現在のゲームの進行はリセットされます。よろしいですか？`;
    this.$("modal-select").classList.add("hidden");
    this.$("modal-confirm").classList.remove("hidden");
  },

  startMode(key) {
    this.mode = key;
    const m = MODES[key];
    document.body.dataset.mode = key;
    this.$("mode-label").textContent = `${m.label}（${m.sizeText}）`;
    this.closeModal();
    this.reset(true);
  },

  /** newPuzzle=true: 新しいランダム盤面を生成 / false: 今の盤面を最初からやり直す */
  reset(newPuzzle) {
    if (this.mode === null) return;
    if (newPuzzle === true || !this.stage) {
      this.stage = MODES[this.mode].newStage();
      this.checkStage(this.stage);
    }
    this.session++;
    this.arrows = Logic.createArrows(this.stage);
    this.busy = false;
    this.mistakes = 0;
    this.over = false;
    this.updateLives();
    document.getElementById("gameover-overlay").classList.add("hidden");
    document.getElementById("clear-overlay").classList.add("hidden");
    this.showMessage("");
    View.render(this.arrows, this.stage.size, (a) => this.onArrowClick(a));
    this.updateRemaining();
  },

  remaining() { return this.arrows.filter((a) => !a.removed).length; },

  updateLives() {
    const left = this.MAX_MISTAKES - this.mistakes;
    this.$("lives").innerHTML = "♥".repeat(left) + '<span class="lost">' + "♥".repeat(this.mistakes) + "</span>";
  },

  updateRemaining() {
    document.getElementById("remaining").textContent = this.remaining();
  },

  showMessage(text) {
    const el = document.getElementById("message");
    el.innerHTML = text || "&nbsp;";
    clearTimeout(this.msgTimer);
    if (text) this.msgTimer = setTimeout(() => (el.innerHTML = "&nbsp;"), 2200);
  },

  async onArrowClick(arrow) {
    if (this.busy || this.over || arrow.removed) return;
    const { movable, blockers } = Logic.checkMove(arrow, this.arrows, this.stage.size);
    if (!movable) {
      View.showBlocked(arrow, blockers);
      this.mistakes++;
      this.updateLives();
      if (this.mistakes >= this.MAX_MISTAKES) {
        this.over = true;
        this.showMessage("");
        this.$("gameover-overlay").classList.remove("hidden");
      } else {
        this.showMessage(`この矢印は動かせません！前に別の矢印があります。（あと${this.MAX_MISTAKES - this.mistakes}回でゲームオーバー）`);
      }
      return;
    }
    this.busy = true; // アニメーション中は入力を受け付けない
    this.showMessage("");
    arrow.removed = true;
    const session = this.session;
    await View.animateOut(arrow, Logic.exitDistance(arrow, this.stage.size));
    if (session !== this.session) return; // アニメーション中にリセット・難易度変更された
    this.updateRemaining();
    this.busy = false;
    if (this.remaining() === 0) {
      document.getElementById("clear-overlay").classList.remove("hidden");
    }
  },
};

document.addEventListener("DOMContentLoaded", () => Game.init());
</script>
